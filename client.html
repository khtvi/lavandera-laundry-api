<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lavandera — Order Queue</title>
<style>
  :root {
    --cream: #fbf5ef;
    --card: #ffffff;
    --strawberry: #d8546f;
    --strawberry-dark: #b93e5b;
    --strawberry-soft: #f6d9de;
    --matcha: #6e8f4e;
    --matcha-dark: #55703b;
    --matcha-soft: #e4ead3;
    --ink: #3a332c;
    --muted: #8a8175;
    --line: #ece2d9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 24px;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .panel {
    max-width: 760px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(90, 60, 50, 0.08);
    overflow: hidden;
    border: 1px solid var(--line);
  }

  .panel-header {
    padding: 28px 32px 22px;
    background: linear-gradient(120deg, var(--strawberry-soft) 0%, var(--matcha-soft) 100%);
  }

  .panel-header h1 {
    margin: 0 0 4px;
    font-size: 26px;
    font-weight: 700;
    color: var(--strawberry-dark);
    letter-spacing: -0.01em;
  }

  .panel-header p {
    margin: 0;
    font-size: 14px;
    color: var(--matcha-dark);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    background: var(--matcha);
    padding: 12px 16px;
  }

  thead th:first-child { padding-left: 32px; }
  thead th:last-child { padding-right: 32px; }

  tbody td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    vertical-align: middle;
  }

  tbody td:first-child { padding-left: 32px; font-weight: 600; }
  tbody td:last-child { padding-right: 32px; }

  tbody tr:last-child td { border-bottom: none; }

  tbody tr:nth-child(even) { background: #fdf9f5; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px !important;
    font-style: italic;
  }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-pending { background: var(--strawberry-soft); color: var(--strawberry-dark); }
  .badge-washing { background: #fde9c8; color: #9a6a12; }
  .badge-ready-for-pickup { background: var(--matcha-soft); color: var(--matcha-dark); }
  .badge-claimed { background: #e6e2da; color: #6b6357; }

  .update-cell {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  select {
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  select:focus {
    outline: 2px solid var(--matcha);
    outline-offset: 1px;
  }

  .cancel-btn {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--strawberry);
    background: #fff;
    color: var(--strawberry-dark);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .cancel-btn:hover { background: var(--strawberry); color: #fff; }

  .cancel-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .add-order-section {
    padding: 20px 32px 24px;
    background: #fffcf9;
    border-bottom: 1px solid var(--line);
  }

  .add-order-section h2 {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 700;
    color: var(--strawberry-dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1.5fr 1.5fr auto;
    gap: 12px;
    align-items: flex-end;
  }

  @media (max-width: 680px) {
    .form-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  @media (max-width: 480px) {
    .form-grid {
      grid-template-columns: 1fr;
    }
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .form-group label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .form-group input,
  .form-group select {
    font: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    box-sizing: border-box;
    width: 100%;
  }

  .form-group input:focus,
  .form-group select:focus {
    outline: 2px solid var(--matcha);
    outline-offset: 1px;
  }

  .add-btn {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    background: var(--matcha);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease;
    white-space: nowrap;
    height: 35px;
    box-sizing: border-box;
  }

  .add-btn:hover {
    background: var(--matcha-dark);
  }

  .add-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .form-feedback {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 600;
    min-height: 16px;
  }

  .panel-footer {
    padding: 14px 32px 20px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

  <div class="panel">
    <div class="panel-header">
      <h1>Lavandera — Order Queue</h1>
      <p>Add new orders, update statuses, or cancel — full-stack live queue.</p>
    </div>

    <form id="add-order-form" class="add-order-section">
      <h2>+ Add New Order</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="customerName">Customer Name</label>
          <input type="text" id="customerName" placeholder="e.g. Liza Gomez" required />
        </div>
        <div class="form-group">
          <label for="loadCount">Loads</label>
          <input type="number" id="loadCount" min="1" placeholder="e.g. 2" required />
        </div>
        <div class="form-group">
          <label for="dropOffTime">Drop-Off Time</label>
          <input type="text" id="dropOffTime" placeholder="e.g. 10:30 AM" required />
        </div>
        <div class="form-group">
          <label for="orderStatus">Status</label>
          <select id="orderStatus">
            <option value="Pending" selected>Pending</option>
            <option value="Washing">Washing</option>
            <option value="Ready for Pickup">Ready for Pickup</option>
            <option value="Claimed">Claimed</option>
          </select>
        </div>
        <div>
          <button type="submit" id="add-btn" class="add-btn">+ Add Order</button>
        </div>
      </div>
      <div id="form-feedback" class="form-feedback"></div>
    </form>

    <table>
      <thead>
        <tr>
          <th>Customer</th>
          <th>Loads</th>
          <th>Status</th>
          <th>Update</th>
        </tr>
      </thead>
      <tbody id="orders-body">
        <tr><td colspan="4" class="empty">Loading orders…</td></tr>
      </tbody>
    </table>

    <div class="panel-footer"></div>
  </div>

<script>
  const API = "http://localhost:3000";
  const STATUSES = ["Pending", "Washing", "Ready for Pickup", "Claimed"];
  const tbody = document.getElementById("orders-body");
  const addOrderForm = document.getElementById("add-order-form");
  const formFeedback = document.getElementById("form-feedback");
  const addBtn = document.getElementById("add-btn");

  function slug(status) {
    return status.toLowerCase().replace(/\s+/g, "-");
  }

  async function loadOrders() {
    try {
      const res = await fetch(`${API}/orders`);
      if (!res.ok) throw new Error(`Server responded with ${res.status}`);
      const orders = await res.json();
      renderOrders(orders);
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="4" class="empty">Can't reach the server. Run "node server.js" in the project folder, then reload this page.</td></tr>`;
    }
  }

  function renderOrders(orders) {
    tbody.innerHTML = "";
    if (!orders.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">No orders right now.</td></tr>';
      return;
    }
    orders.forEach((order) => tbody.appendChild(buildRow(order)));
  }

  function buildRow(order) {
    const tr = document.createElement("tr");

    const customerTd = document.createElement("td");
    customerTd.textContent = order.customerName;

    const loadsTd = document.createElement("td");
    loadsTd.textContent = order.loadCount;

    const statusTd = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = `badge badge-${slug(order.status)}`;
    badge.textContent = order.status;
    statusTd.appendChild(badge);

    const updateTd = document.createElement("td");
    updateTd.className = "update-cell";

    const select = document.createElement("select");
    STATUSES.forEach((status) => {
      const opt = document.createElement("option");
      opt.value = status;
      opt.textContent = status;
      if (status === order.status) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener("change", async () => {
      select.disabled = true;
      const ok = await updateStatus(order.id, select.value);
      if (ok) {
        await loadOrders();
      } else {
        select.disabled = false;
      }
    });

    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "cancel-btn";
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", async () => {
      cancelBtn.disabled = true;
      cancelBtn.textContent = "Cancelling…";
      const ok = await cancelOrder(order.id);
      if (ok) {
        await loadOrders();
      } else {
        cancelBtn.disabled = false;
        cancelBtn.textContent = "Cancel";
      }
    });

    updateTd.append(select, cancelBtn);
    tr.append(customerTd, loadsTd, statusTd, updateTd);
    return tr;
  }

  const API_KEY = "laundry-secret-2026";

  addOrderForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const customerName = document.getElementById("customerName").value.trim();
    const loadCount = Number(document.getElementById("loadCount").value);
    const dropOffTime = document.getElementById("dropOffTime").value.trim();
    const status = document.getElementById("orderStatus").value;

    addBtn.disabled = true;
    addBtn.textContent = "Adding…";
    formFeedback.textContent = "";

    try {
      const res = await fetch(`${API}/orders`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": API_KEY,
        },
        body: JSON.stringify({ customerName, loadCount, status, dropOffTime }),
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || `Server responded with ${res.status}`);
      }

      addOrderForm.reset();
      document.getElementById("orderStatus").value = "Pending";
      formFeedback.style.color = "var(--matcha-dark)";
      formFeedback.textContent = `Order for ${data.customerName} added successfully!`;
      setTimeout(() => { formFeedback.textContent = ""; }, 3500);
      await loadOrders();
    } catch (err) {
      formFeedback.style.color = "var(--strawberry-dark)";
      formFeedback.textContent = `Error: ${err.message}`;
    } finally {
      addBtn.disabled = false;
      addBtn.textContent = "+ Add Order";
    }
  });

  async function updateStatus(id, status) {
    try {
      const res = await fetch(`${API}/orders/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": API_KEY,
        },
        body: JSON.stringify({ status }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert(data.error || "Failed to update status");
        return false;
      }
      return true;
    } catch (err) {
      alert("Network error: " + err.message);
      return false;
    }
  }

  async function cancelOrder(id) {
    try {
      const res = await fetch(`${API}/orders/${id}`, {
        method: "DELETE",
        headers: {
          "x-api-key": API_KEY,
        },
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert(data.error || "Failed to cancel order");
        return false;
      }
      return true;
    } catch (err) {
      alert("Network error: " + err.message);
      return false;
    }
  }

  loadOrders();
</script>

</body>
</html>
